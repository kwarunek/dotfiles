# ~/.config/systemd/user/ackstile.service.d/path.conf
# Versioned in dotfiles, linked by `./installer.sh ackstile`; overrides the
# PATH of the stock unit (ackstile's `make install`).
#
# A user service does not get the login shell's PATH. System directories come
# first so python3 is /usr/bin/python3 with python3-requests (jira-helpdesk)
# and jq is the distro one; aws and kubectl only exist as asdf shims,
# so the shims come last. Add ~/.krew/bin here if an automation needs krew.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin:/bin:%h/.asdf/shims
